<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Registration</title>
  <style>
    body {
      font-family: Arial;
      background: #f4f4f4;
    }
    .container {
      width: 350px;
      margin: 100px auto;
      background: white;
      padding: 20px;
      border-radius: 5px;
    }
    input, button {
      width: 100%;
      margin: 10px 0;
      padding: 8px;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }
    .debug-box {
      margin-top: 20px;
      padding: 10px;
      background: #eef;
      border: 1px solid #99c;
      display: none;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>User Registration</h2>

  <!-- NO form submit -->
  <input type="text" id="username" placeholder="Enter Username" />
  <input type="email" id="email" placeholder="Enter Email" />
  <button onclick="registerUser()">Register</button>

  <div class="debug-box" id="debugBox"></div>
</div>

<script>
  async function registerUser() {
    const username = document.getElementById("username").value;
    const email = document.getElementById("email").value;

    const response = await fetch("/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, email })
    });

    const data = await response.json();
    const debugBox = document.getElementById("debugBox");
    debugBox.style.display = "block";

    if (!data.success) {
      debugBox.innerHTML = `
        <strong style="color:red;">${data.message}</strong>
      `;
      return;
    }

    debugBox.innerHTML = `
      <strong>Registration Successful</strong><br><br>
      <b>Database:</b> ${data.database}<br>
      <b>Table:</b> ${data.table}<br>
      <b>SQL Query:</b><br>
      <code>${data.query}</code><br><br>
      <b>Inserted Data:</b><br>
      Username: ${data.username}<br>
      Email: ${data.email}
    `;
  }
</script>

</body>
</html>
